%YAML 1.2
---
$id: http://devicetree.org/schemas/power/reset/fortinet,fsoc3-reboot.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Fortinet FortiSOC3 restart

maintainers:
  - Radeon24 <Radeon24@users.noreply.github.com>

description:
  The Fortinet FortiSOC3 restarts on a rising edge of bit 1 of the system
  manager register at offset 0x68. The bit is first written low, then
  high, the other bits of the register being written back unchanged. A
  single masked write, as syscon-reboot does, would not produce the edge
  when the bit is already set.

properties:
  compatible:
    const: fortinet,fsoc3-reboot

  fortinet,sysmgr:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: The system manager (fortinet,fsoc3-sysmgr) node.

required:
  - compatible
  - fortinet,sysmgr

additionalProperties: false

examples:
  - |
    reboot {
        compatible = "fortinet,fsoc3-reboot";
        fortinet,sysmgr = <&sysmgr>;
    };
