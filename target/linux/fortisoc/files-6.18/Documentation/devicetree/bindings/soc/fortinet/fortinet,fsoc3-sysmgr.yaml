%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/fortinet/fortinet,fsoc3-sysmgr.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Fortinet FortiSOC3 system manager

maintainers:
  - Radeon24 <Radeon24@users.noreply.github.com>

description:
  System control registers of the Fortinet FortiSOC3. Among them, the
  restart request (bit 1 of the register at offset 0x68, see
  fortinet,fsoc3-reboot), the release of the secondary cores (bits 17 to
  19 of the register at offset 0x74) and their entry points (registers at
  offsets 0xf4 to 0xfc), used by the "fortinet,fsoc3-smp" enable-method.

properties:
  compatible:
    items:
      - const: fortinet,fsoc3-sysmgr
      - const: syscon

  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    system-controller@fc000000 {
        compatible = "fortinet,fsoc3-sysmgr", "syscon";
        reg = <0xfc000000 0x1000>;
    };
