%YAML 1.2
---
$id: http://devicetree.org/schemas/mmc/fortinet,fsoc3-sdhi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Fortinet FortiSOC3 SD/MMC host interface

maintainers:
  - Radeon24 <Radeon24@users.noreply.github.com>

description:
  The eMMC controller of the Fortinet FortiSOC3, a Renesas R-Car Gen3 style
  SDHI (TMIO family) with its registers 8 bytes apart and a 32-bit data
  port. Its internal DMA controller, at offset 0x800, is not described.

allOf:
  - $ref: mmc-controller.yaml#

properties:
  compatible:
    const: fortinet,fsoc3-sdhi

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1
    description:
      Input clock of the controller, from which the card clock is divided.

  resets:
    maxItems: 1

  fortinet,force-ro:
    type: boolean
    description:
      Only pass to the controller the commands needed to bring a card up
      and to read its user area. Writes, erases, write protection, locking
      and changes of the extended CSD registers other than the bus width
      and the timing are refused before they reach the card, whoever
      issues them.

  fortinet,write-windows:
    $ref: /schemas/types.yaml#/definitions/uint32-matrix
    maxItems: 4
    items:
      items:
        - description: First 512-byte sector of the window, in the user area
        - description: Number of sectors of the window
          minimum: 1
    description:
      Write windows of the read-only guard, for an installer writing one
      firmware slot. Once armed from user space, plain writes of 512-byte
      blocks to the user area lying entirely inside one window are let
      through; everything else stays refused. In a write of sector 0,
      only the bytes listed by fortinet,sector0-bytes may change. Without
      windows, the guard refuses every write.

  fortinet,sector0-bytes:
    $ref: /schemas/types.yaml#/definitions/uint32-matrix
    maxItems: 8
    items:
      items:
        - description: Offset of the first byte, in sector 0
          maximum: 511
        - description: Number of bytes
          minimum: 1
          maximum: 512
    description:
      Bytes of sector 0 that a write through a window may change, compared
      with sector 0 as it was when the windows were armed. Without it, the
      content of sector 0 may not change at all.

  fortinet,persistent-windows:
    $ref: /schemas/types.yaml#/definitions/uint32-matrix
    maxItems: 4
    items:
      items:
        - description: First 512-byte sector of the window, in the user
            area, never sector 0
          minimum: 1
        - description: Number of sectors of the window
          minimum: 1
    description:
      Areas of the user area holding a writable file system, open to plain
      writes of 512-byte blocks from boot, without arming, until the
      windows are turned off. An area reached through a loop device backed
      by the whole disk is aligned on 4 KiB pages (multiples of 8 sectors).

dependencies:
  fortinet,write-windows: [ "fortinet,force-ro" ]
  fortinet,sector0-bytes: [ "fortinet,write-windows" ]
  fortinet,persistent-windows: [ "fortinet,force-ro" ]

required:
  - compatible
  - reg
  - interrupts
  - clocks

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    mmc@f3010000 {
        compatible = "fortinet,fsoc3-sdhi";
        reg = <0xf3010000 0x2000>;
        interrupts = <GIC_SPI 22 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&sdhi_clk>;
        bus-width = <4>;
        max-frequency = <25000000>;
        non-removable;
        no-sdio;
        no-sd;
        fortinet,force-ro;
        fortinet,write-windows = <0 1>, <786440 524288>;
        fortinet,sector0-bytes = <0x30 32>, <0x12c 4>, <0x1be 1>, <0x1ce 1>;
        fortinet,persistent-windows = <819208 491520>;
    };
