%YAML 1.2
---
$id: http://devicetree.org/schemas/mmc/fortinet,fsoc3-sdhi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Fortinet FortiSOC3 SD/MMC host interface

maintainers:
  - Radeon24 <Radeon24@users.noreply.github.com>

description:
  The eMMC controller of the Fortinet FortiSOC3, a Renesas R-Car Gen3 style
  SDHI (TMIO family) with its registers 8 bytes apart and a 32-bit data
  port. Its internal DMA controller, at offset 0x800, is not described.

allOf:
  - $ref: mmc-controller.yaml#

properties:
  compatible:
    const: fortinet,fsoc3-sdhi

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1
    description:
      Input clock of the controller, from which the card clock is divided.

  resets:
    maxItems: 1

  fortinet,force-ro:
    type: boolean
    description:
      Only pass to the controller the commands needed to bring a card up
      and to read its user area. Writes, erases, write protection, locking
      and changes of the extended CSD registers other than the bus width
      and the timing are refused before they reach the card, whoever
      issues them.

  fortinet,write-windows:
    $ref: /schemas/types.yaml#/definitions/uint32-matrix
    maxItems: 4
    items:
      items:
        - description: First 512-byte sector of the window, in the user area
        - description: Number of sectors of the window
          minimum: 1
    description:
      Write windows of the read-only guard, for an installer writing one
      firmware slot. Once armed from user space, plain writes of 512-byte
      blocks to the user area lying entirely inside one window are let
      through; everything else stays refused. A window holding sector 0
      lets the whole sector be written. Without it, the guard refuses
      every write.

dependencies:
  fortinet,write-windows: [ "fortinet,force-ro" ]

required:
  - compatible
  - reg
  - interrupts
  - clocks

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    mmc@f3010000 {
        compatible = "fortinet,fsoc3-sdhi";
        reg = <0xf3010000 0x2000>;
        interrupts = <GIC_SPI 22 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&sdhi_clk>;
        bus-width = <4>;
        max-frequency = <25000000>;
        non-removable;
        no-sdio;
        no-sd;
        fortinet,force-ro;
        fortinet,write-windows = <0 1>, <786440 524288>;
    };
